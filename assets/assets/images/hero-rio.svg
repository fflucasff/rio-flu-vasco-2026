      <stop offset="1" stop-color="#cbb183"/>
    </linearGradient>
    <linearGradient id="stadium" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#c9c0ad"/>
    </linearGradient>
    <filter id="grain">
