<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rio de Janeiro, Cristo Redentor, Maracanã e praia</title>
  <desc id="desc">Composição panorâmica e harmoniosa dos principais momentos da viagem ao Rio.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#244842"/>
      <stop offset=".48" stop-color="#78958c"/>
      <stop offset="1" stop-color="#e3c38f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
